# Supabase CLI config for unsaid (local dev).
# Defaults are used for anything not specified here.

project_id = "unsaid"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 100

[db]
port = 54322
major_version = 15

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false


# NOTE: site_url/redirects above are LOCAL-DEV values. Never `supabase config push`
# this file against the prod project without fixing them first — it would clobber
# the live auth settings. Email templates below are pushed via the Management API
# (see supabase/templates/).
[auth.email.template.confirmation]
subject = "your quiet way in"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.magic_link]
subject = "your quiet way back in"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.recovery]
subject = "get back into unsaid"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "confirm your new address"
content_path = "./supabase/templates/email_change.html"

# Every function requires a valid JWT — all writes are caller-authenticated.
[functions.publish]
verify_jwt = true
import_map = "./functions/deno.json"

[functions.react]
verify_jwt = true
import_map = "./functions/deno.json"

[functions.report]
verify_jwt = true
import_map = "./functions/deno.json"

[functions.mute]
verify_jwt = true
import_map = "./functions/deno.json"

[functions.role-check]
verify_jwt = true
import_map = "./functions/deno.json"

[functions.wipe-account]
verify_jwt = true
import_map = "./functions/deno.json"

[functions.notify-batch]
verify_jwt = true
import_map = "./functions/deno.json"
